<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Locke & Key</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1> Locke & Key</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Cartas</a>
        </nav>
    </header>

    <section class="intro">
        <h2>Catálogo de Cartas</h2>
        <p>Compare os atributos dos irmãos Locke da série Locke & Key</p>
    </section>

    <main class="catalogo">
        

        <article class="card">
            <h3>Tyler Locke</h3>
            <img src="https://static.wikia.nocookie.net/p__/images/d/d7/Tyler_Locke.jpg/revision/latest?cb=20210221005325&path-prefix=protagonist" alt="Tyler">
            <ul>
                <li>Força: 90</li>
                <li>Coragem: 85</li>
            </ul>
        </article>

        <article class="card">
            <h3>Kinsey Locke</h3>
            <img src="https://static.wikia.nocookie.net/lockekey/images/9/9e/Kinsey_Locke_-_profile.jpg/revision/latest?cb=20210708183534" alt="Kinsey">
            <ul>
                <li>Força: 70</li>
                <li>Coragem: 95</li>
            </ul>
        </article>

        <article class="card">
            <h3>Bode Locke</h3>
            <img src="https://static.wikia.nocookie.net/lockekey/images/2/2b/Dodge_%28Bode_Locke%29_-_profile.jpg/revision/latest?cb=20220906225240" alt="Bode">
            <ul>
                <li>Força: 50</li>
                <li>Coragem: 80</li>
            </ul>
        </article>

    </main>

</body>
</html>
